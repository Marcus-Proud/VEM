name: Reachmee → Webflow Sync

on:
  schedule:
    # Kör var 10:e minut
    - cron: "*/10 * * * *" 
  workflow_dispatch:
    # Tillåter manuell körning via GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kör synk
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: node sync.js
